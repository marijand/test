[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prayfocus-outreach"
version = "0.1.0"
description = "Backlink & press outreach engine for prayfocus.app (all steps except sending)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prayfocus = "prayfocus_outreach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
